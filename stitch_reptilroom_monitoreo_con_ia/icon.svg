<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#16221d" />
      <stop offset="100%" stop-color="#0c1210" />
    </radialGradient>

    <!-- Bio-Emerald Tech Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Warm Accent Coral Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAAA6" />
      <stop offset="100%" stop-color="#FF7A59" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Rounded Tile -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)" stroke="#22332a" stroke-width="3" />

  <!-- Subtle Bio Grid / Sensor Ring in Background -->
  <circle cx="256" cy="235" r="140" fill="none" stroke="#1c3026" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="256" cy="235" r="175" fill="none" stroke="#162820" stroke-width="1.5" />

  <!-- Emblem Group -->
  <g transform="translate(0, 0)">
    <!-- Reptile Spiral Body / Chameleon Curve symbolizing care, health cycle & monitoring -->
    <path d="M 270 120
             C 335 120 380 165 380 230
             C 380 295 330 345 260 345
             C 200 345 160 305 160 250
             C 160 205 195 175 235 175
             C 265 175 285 195 285 225
             C 285 245 270 260 250 260
             C 240 260 232 252 232 242" 
          fill="none" 
          stroke="url(#emeraldGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />

    <!-- Organic Leaf / Sensor Crest on Head -->
    <path d="M 285 110 
             C 315 85 345 95 350 125 
             C 330 140 298 135 285 110 Z" 
          fill="url(#emeraldGrad)" />

    <!-- Chameleon Eye / Bio-Scanner Focus Ring -->
    <circle cx="340" cy="180" r="18" fill="#13241c" stroke="url(#emeraldGrad)" stroke-width="6" />
    <circle cx="340" cy="180" r="7" fill="url(#coralGrad)" />

    <!-- Bio-Monitor Heartbeat / Care Accent Line (subtle fusion with HerpScan AI) -->
    <path d="M 215 295 
             L 240 295 
             L 252 270 
             L 266 315 
             L 278 290 
             L 290 295 
             L 305 295" 
          fill="none" 
          stroke="url(#coralGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Dynamic Scale / AI Data Node Dots -->
    <circle cx="370" cy="275" r="5" fill="#6EE7B7" opacity="0.8" />
    <circle cx="350" cy="315" r="4" fill="#34D399" opacity="0.6" />
  </g>

  <!-- Typography / Brand Name -->
  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="1.5" 
        fill="#FFFFFF">
    Herp<tspan fill="#6EE7B7">Care</tspan>
  </text>

  <!-- Subtitle / Tagline -->
  <text x="256" y="452" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#FF9E80">
    BIOMÓDULO &amp; IA
  </text>
</svg>
